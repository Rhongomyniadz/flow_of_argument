[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-of-argument"
version = "0.0.0"
description = "ACL-style artifact for conversational assumption and implicature analyses."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "TBD" }

dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "scipy",
  "statsmodels",
  "plotly",
  "kaleido",
  "tqdm",
  "umap-learn",
]

[project.optional-dependencies]
llm = [
  "torch",
  "transformers",
  "sentence-transformers",
  "vllm",
  "sporc",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["experiments.exp8_assumption_embedding_pilot*"]
namespaces = true
