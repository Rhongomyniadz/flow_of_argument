<style>
table, th, td {
  border:1px solid black;
}
td {
  text-align: center;
}
.tooltip-inner {
    min-width: 100px;
    max-width: 500px;
}
.assumption-box {
    border: 1px solid #ddd;
    border-left: 4px solid #2b2b6b;
    padding: 8px 12px;
    margin: 10px 0 15px;
    background: #fafafa;
}
.assumption-label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #2b2b6b;
}
.assumption-text {
    margin-top: 4px;
    font-style: italic;
}
</style>

<div class="row">
  <div class="col-md-12">
    <div class="row">
      <div class="col-md-12">

        <div name="context_text" class="instance">
          <div id="instance-text" name="instance_text" style="max-width:700px;">
            {{instance | safe}}
          </div>
        </div>

        <!-- NEW: assumption under the turn text -->
        <div class="assumption-box">
          <div class="assumption-label">Assumption to judge:</div>
          <div class="assumption-text">
            {% if assumption_text %}
              {{ assumption_text }}
            {% elif meta is defined and meta.assumption_text %}
              {{ meta.assumption_text }}
            {% else %}
              <em>No assumption provided.</em>
            {% endif %}
          </div>
        </div>
      </div>
        <div class="annotation_schema">
          {{annotation_schematic}}
        </div>
      </div>
    </div>

    <div style="height: 15px;">
  </div>
  <div class="col-md-12">
  </div>
</div>
